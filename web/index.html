<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OsteoNeuralNetwork</title>
    <meta
      name="description"
      content="A research demonstration that screens bone radiographs for possible lesions and shows what the model looked at. Not a medical device."
    />
    <!--
      No third-party analytics, no tag manager, no font CDN beyond the one
      stylesheet theme.css imports. Every request this page makes is either to
      its own origin or to Google's font CDN, which keeps the privacy statement
      in compliance/DPIA.md true by construction.
    -->
    <!--
      Canonical, and it matters more than usual here: this exact site also
      answers on onnm.kali-fz.workers.dev, which is kept alive on purpose as a
      fallback. Two hostnames serving identical pages is duplicate content, and
      without this a search engine is free to decide the workers.dev address is
      the real one. This says which address is.
    -->
    <link rel="canonical" href="https://osteoneuralnetwork.com/" />

    <!-- Link previews: what a shared URL looks like in Slack, LinkedIn, Discord. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OsteoNeuralNetwork" />
    <meta property="og:title" content="OsteoNeuralNetwork" />
    <meta
      property="og:description"
      content="A research demonstration that screens bone radiographs for possible lesions and shows what the model looked at. Not a medical device."
    />
    <meta property="og:url" content="https://osteoneuralnetwork.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OsteoNeuralNetwork" />
    <meta
      name="twitter:description"
      content="A research demonstration that screens bone radiographs for possible lesions and shows what the model looked at. Not a medical device."
    />

    <!--
      Structured data. The useful part is `alternateName`: people write this
      project's name as one word, as three, and as an abbreviation, and this is
      what tells a search engine those all denote the same thing.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "OsteoNeuralNetwork",
        "alternateName": ["ONNM", "Osteo Neural Network", "OsteoNeuralNetwork Model"],
        "url": "https://osteoneuralnetwork.com/",
        "description": "An open research prototype that screens bone radiographs for possible lesions, returns calibrated probabilities and shows a Grad-CAM heat map of what influenced the result. Not a medical device."
      }
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2e6b47" />
  </head>
  <body>
    <div id="app" class="onnm-shell">
      <!--
        Server-rendered nothing: the router paints the first screen. A visitor
        with JavaScript disabled sees the message below, which is honest about
        why rather than showing an empty page.
      -->
      <noscript>
        <div style="padding: 48px 0; max-width: 70ch">
          <h1>OsteoNeuralNetwork</h1>
          <p>
            An open research prototype that screens bone radiographs for
            possible lesions. It returns a calibrated probability for each of
            three classes, normal, benign and malignant, and draws a Grad-CAM
            heat map showing which part of the image influenced the result.
          </p>
          <p>
            <strong>Research and education only.</strong> This is not a medical
            device, has no FDA, CE or MHRA clearance, and has not been
            clinically validated. Every radiograph needs a qualified clinician.
          </p>
          <p>
            The scanner itself needs JavaScript: it uploads an image, draws a
            heat map over it and renders an interactive globe, none of which has
            a meaningful static fallback.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
