# ONNM community API — Cloudflare Worker + D1.
#
# FREE TIER ONLY. The bindings below are Workers and D1, both of which have
# free allowances. There is deliberately no R2, KV, Durable Objects, Queues,
# Cron Trigger, Hyperdrive or Vectorize binding here — several of those require
# a paid plan or a payment method, and adding one is how a $0 project quietly
# becomes a billed one. If you ever add a binding, check its pricing first.
#
# With no payment method on the Cloudflare account, overage cannot be charged;
# requests fail instead. The caps inside src/worker.js exist so that failure is
# an intelligible refusal long before any platform limit is reached.

name = "onnm-community"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# Keep the Worker off a public *.workers.dev URL by default is NOT possible for
# a free plan without a custom domain, so the API is protected by a bearer key
# on every route instead — see the auth check in worker.js. There are no
# unauthenticated endpoints.
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 0.1   # free-tier friendly; full logging is not needed here

[[d1_databases]]
binding = "DB"
# The database is named `onn-model` in the dashboard, not `onnm-community`.
# The binding resolves by id, so the Worker was never affected — but
# `wrangler d1 execute <name>` resolves by NAME, so every migration command
# needs this one. Keeping the wrong name here is how an hour disappears into
# "database not found" while the Worker is demonstrably talking to it.
database_name = "onn-model"
database_id = "961f0440-7ff1-466e-88fe-0c2b30f3083b"

# ---------------------------------------------------------------------------
# Secrets — set these with `wrangler secret put`, never in this file.
# This file is committed to a public repository.
#
#   npx wrangler secret put API_KEY      # the Streamlit app's key
#   npx wrangler secret put ADMIN_KEY    # your review/export key
#
# API_KEY   can read and write ordinary rows.
# ADMIN_KEY additionally unlocks /admin/* (review queue, approvals, export).
# Two separate keys so the app deployed on Hugging Face cannot approve its own
# training data even if its secret leaks.
# ---------------------------------------------------------------------------
