# Defaults for `streamlit run app.py`, so the zero-argument launch is the safe one.

[server]
# NOTE: `address` and `port` are deliberately NOT set here.
#
# This file is committed, and Streamlit Community Cloud reads it. Pinning the
# bind address to localhost or the port to 8501 risks the platform's proxy
# being unable to reach the app, which presents as a deploy that simply never
# comes up -- with no useful error, on a machine you cannot attach to.
#
# Locally the loopback bind still matters: Streamlit's default is 0.0.0.0,
# which on a LAN (or behind a forwarding router) makes an uploaded radiograph
# reachable by other machines. Use the launcher, which sets it explicitly:
#
#     python run_local.py
#
# or pass it yourself:  streamlit run app.py --server.address localhost
headless = true          # do not auto-open a browser; the terminal prints the URL
maxUploadSize = 400      # MB. Uncompressed 16-bit DICOM gets large.
fileWatcherType = "auto"

[browser]
# Usage stats are an outbound network call. "Runs entirely offline" has to mean
# it, and a radiograph viewer is the wrong place to make an exception.
gatherUsageStats = false

[theme]
# Git-Design tokens. Streamlit paints the chrome it owns (widget accents, the
# running indicator) before any CSS lands, so these have to agree with theme.py
# or the first paint of every rerun flashes the stock palette.
base = "light"
primaryColor = "#08872b"
backgroundColor = "#e9edec"
secondaryBackgroundColor = "#f2f5f3"
textColor = "#000000"

[runner]
fastReruns = true
